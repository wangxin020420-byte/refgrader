<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <rect width="1600" height="720" fill="#ffffff"/>

  <style>
    .title { font: 700 54px "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
    .subtitle { font: 30px "Microsoft YaHei", Arial, sans-serif; fill: #526176; }
    .math { font: 44px "Times New Roman", "Cambria Math", serif; fill: #111827; }
    .math2 { font: 40px "Times New Roman", "Cambria Math", serif; fill: #111827; }
    .tag { font: 700 42px "Microsoft YaHei", Arial, sans-serif; }
    .note { font: 28px "Microsoft YaHei", Arial, sans-serif; fill: #526176; }
    .green { fill: #229d68; }
    .orange { fill: #f59e0b; }
    .red { fill: #dc4545; }
    .rule { stroke: #d4dbe7; stroke-width: 3; }
  </style>

  <text x="78" y="88" class="title">三支域定义</text>
  <text x="78" y="145" class="subtitle">A3WA 阈值给出基础划分，复查线索与强拒判线索作为域修正项。</text>

  <!-- Left-hand side -->
  <text x="88" y="330" class="math">T</text>
  <text x="118" y="300" class="math2">m</text>
  <text x="118" y="365" class="math2">α,β</text>
  <text x="205" y="330" class="math">(x_i) =</text>

  <!-- Stable brace drawn as a path, avoiding font-dependent brace rendering -->
  <path d="M 444 202
           C 423 202, 423 245, 423 278
           C 423 306, 404 319, 390 330
           C 404 341, 423 354, 423 382
           C 423 415, 423 458, 444 458"
        fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round"/>

  <!-- Piecewise rows. Keep each condition as one text element to prevent PPT subscript drift. -->
  <text x="490" y="240" class="tag green">POS,</text>
  <text x="670" y="240" class="math2">μ(x_i) ≥ α  ∧  x_i ∉ Ω_BND</text>

  <text x="490" y="340" class="tag orange">BND,</text>
  <text x="670" y="340" class="math2">β &lt; μ(x_i) &lt; α  ∨  x_i ∈ Ω_BND</text>

  <text x="490" y="440" class="tag red">NEG,</text>
  <text x="670" y="440" class="math2">μ(x_i) ≤ β  ∨  x_i ∈ Ω_NEG</text>

  <line x1="80" y1="545" x2="1520" y2="545" class="rule"/>

  <text x="92" y="605" class="note">μ(x)=1−R(x)，R(x) 由提取质量、评分分歧、语义风险与留白比例加权得到。</text>
  <text x="92" y="655" class="note">Ω_BND：边界复查线索；Ω_NEG：提取失败、分歧极大或严重语义冲突等强拒判线索。</text>
</svg>
